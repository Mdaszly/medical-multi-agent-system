# Infrastructure only: PostgreSQL + Neo4j + Redis
# Usage (from this directory):
#   docker compose up -d postgres neo4j redis
version: "3.9"

services:
  postgres:
    image: docker.1ms.run/library/postgres:16-alpine
    environment:
      POSTGRES_DB: clinical_decision
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - ../../persistence-data/postgres:/var/lib/postgresql/data
      - ../docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/neo4j:latest
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4jpass}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - ../../persistence-data/neo4j:/data

  redis:
    image: docker.1ms.run/library/redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - ../../persistence-data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
